name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # go.mod pins the toolchain version; let the go command fetch it.
  GOTOOLCHAIN: auto

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...
        timeout-minutes: 15

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
